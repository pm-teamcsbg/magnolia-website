[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Redirect www to non-www
[[redirects]]
  from = "https://www.magnoliabythesea.com/*"
  to = "https://magnoliabythesea.com/:splat"
  status = 301
  force = true

# Clean URL for the offers page (magnoliabythesea.com/offers)
[[redirects]]
  from = "/offers"
  to = "/offers.html"
  status = 200

# Cache static assets
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
