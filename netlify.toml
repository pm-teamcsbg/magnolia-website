[build]
  command = "bash scripts/indexnow-ping.sh || true"
  publish = "."

# Redirect www to non-www
[[redirects]]
  from = "https://www.magnoliabythesea.com/*"
  to = "https://magnoliabythesea.com/:splat"
  status = 301
  force = true

# Clean URL for the offers page (magnoliabythesea.com/offers)
[[redirects]]
  from = "/offers"
  to = "/offers.html"
  status = 200

# Clean URL for the contact page (magnoliabythesea.com/contact)
[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

# Clean URL for the post-booking thank-you page (magnoliabythesea.com/thank-you)
[[redirects]]
  from = "/thank-you"
  to = "/thank-you.html"
  status = 200

# Cache static assets
# Note: "/photos/*" also matched the /photos gallery PAGE (pretty URL) and cached its HTML for 30 days.
# Scope long caching to image folders only.
[[headers]]
  for = "/photos/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/photos/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
