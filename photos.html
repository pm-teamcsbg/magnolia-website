/* ── Build Gallery ── */
const grid = document.getElementById('galleryGrid');
photos.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'gallery-item showing';
    div.dataset.categories = p.cat.join(',');
    div.dataset.index = i;
    div.innerHTML = `
        <img src="photos/gallery/thumbs/${p.id}.jpg" alt="${p.label}" loading="lazy">
        <div class="overlay"><span class="overlay-label">${p.label}</span><span class="overlay-desc">${p.desc}</span></div>
    `;
    div.addEventListener('click', () => openLightbox(i));
    grid.appendChild(div);
});

/* ── Filtering ── */
let activeFilter = 'all';
const filterBtns = document.querySelectorAll('.filter-btn');

filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const filter = btn.dataset.filter;
        if (filter === activeFilter) return;
        activeFilter = filter;
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        applyFilter(filter);
    });
});

function applyFilter(filter) {
    const items = document.querySelectorAll('.gallery-item');
    items.forEach(item => {
        const cats = item.dataset.categories.split(',');
        const match = filter === 'all' || cats.includes(filter);
        if (!match) {
            item.classList.add('hiding');
            item.classList.remove('showing');
            setTimeout(() => { item.classList.add('hidden'); item.classList.remove('hiding'); }, 250);
        } else {
            item.classList.remove('hidden', 'hiding');
            item.classList.add('showing');
        }
    });
}

/* ── Lightbox ── */
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lbImg');
const lbLabel = document.getElementById('lbLabel');
const lbDesc = document.getElementById('lbDesc');
const lbCounter = document.getElementById('lbCounter');
let currentIndex = 0;
let visiblePhotos = [];

function getVisiblePhotos() {
    const items = document.querySelectorAll('.gallery-item:not(.hidden):not(.row-overflow)');
    return Array.from(items).map(el => parseInt(el.dataset.index));
}

function openLightbox(index) {
    visiblePhotos = getVisiblePhotos();
    currentIndex = visiblePhotos.indexOf(index);
    if (currentIndex === -1) currentIndex = 0;
    showPhoto();
    lightbox.classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    lightbox.classList.remove('open');
    document.body.style.overflow = '';
}

function showPhoto() {
    const p = photos[visiblePhotos[currentIndex]];
    lbImg.src = `photos/gallery/full/${p.id}.jpg`;
    lbLabel.textContent = p.label;
    lbDesc.textContent = p.desc;
    lbCounter.textContent = `${currentIndex + 1} of ${visiblePhotos.length}`;
}

function nextPhoto() {
    currentIndex = (currentIndex + 1) % visiblePhotos.length;
    showPhoto();
}

function prevPhoto() {
    currentIndex = (currentIndex - 1 + visiblePhotos.length) % visiblePhotos.length;
    showPhoto();
}

document.getElementById('lbClose').addEventListener('click', closeLightbox);
document.getElementById('lbNext').addEventListener('click', nextPhoto);
document.getElementById('lbPrev').addEventListener('click', prevPhoto);
lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

/* Keyboard navigation */
document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextPhoto();
    if (e.key === 'ArrowLeft') prevPhoto();
});

/* Touch/swipe support */
let touchStartX = 0;
lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, {passive: true});
lightbox.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 50) { diff > 0 ? nextPhoto() : prevPhoto(); }
}, {passive: true});

/* ── Back to Top ── */
const backTop = document.getElementById('backTop');
window.addEventListener('scroll', () => {
    backTop.classList.toggle('show', window.scrollY > 600);
});
backTop.addEventListener('click', () => window.scrollTo({top: 0, behavior: 'smooth'}));

/* ── Even Row Logic ── */
function enforceEvenRows() {
    const grid = document.getElementById('galleryGrid');
    if (!grid) return;
    // Get items that aren't filtered out
    const items = Array.from(grid.querySelectorAll('.gallery-item:not(.hidden)'));
    if (items.length === 0) return;

    // Reset overflow-hidden items first
    items.forEach(el => { el.style.display = ''; el.classList.remove('row-overflow'); });

    // Measure columns from first visible row
    const firstTop = items[0].getBoundingClientRect().top;
    let cols = 0;
    for (let i = 0; i < items.length; i++) {
        if (Math.abs(items[i].getBoundingClientRect().top - firstTop) < 2) {
            cols++;
        } else break;
    }
    if (cols < 1) cols = 1;

    const visibleCount = Math.floor(items.length / cols) * cols;
    if (visibleCount === 0) return;
    for (let j = visibleCount; j < items.length; j++) {
        items[j].style.display = 'none';
        items[j].classList.add('row-overflow');
    }
}

// Patch applyFilter to also enforce even rows after filtering
const _origApplyFilter = applyFilter;
applyFilter = function(filter) {
    _origApplyFilter(filter);
    // Wait for hide animations to finish, then enforce rows
    setTimeout(enforceEvenRows, 300);
};

window.addEventListener('load', enforceEvenRows);
window.addEventListener('resize', enforceEvenRows);

/* ── URL hash filtering ── */
if (window.location.hash) {
    const filter = window.location.hash.substring(1);
    const btn = document.querySelector(`.filter-btn[data-filter="${filter}"]`);
    if (btn) btn.click();
} else {
    // Initial even rows on load
    setTimeout(enforceEvenRows, 100);
}
</script>
