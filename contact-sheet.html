        .categories { text-align: center; margin-bottom: 1rem; padding: 1rem; background: white; border-radius: 8px; max-width: 1000px; margin-left: auto; margin-right: auto; }
        .categories h3 { margin-bottom: 0.5rem; color: #1B3A5C; }
        .cat-list { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
        .cat-tag { background: #e8f0f8; padding: 0.3rem 0.75rem; border-radius: 4px; font-size: 0.85rem; color: #1B3A5C; cursor: pointer; transition: background 0.2s; }
        .cat-tag:hover, .cat-tag.active { background: #2E8B8B; color: white; }
        .stats { text-align: center; margin-bottom: 2rem; padding: 1rem; background: white; border-radius: 8px; max-width: 1000px; margin-left: auto; margin-right: auto; }

        .stat-row { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; font-size: 0.85rem; }
        .stat-item { background: #f0f0f0; padding: 0.3rem 0.7rem; border-radius: 4px; }
        .stat-count { font-weight: 700; color: #1B3A5C; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; max-width: 1400px; margin: 0 auto; }
        .photo-card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); transition: opacity 0.3s; }
        .photo-card.dim { opacity: 0.25; }
        .photo-card img { width: 100%; aspect-ratio: 4/3; object-fit: cover; display: block; cursor: pointer; }
        .photo-info { padding: 0.75rem; }
        .photo-num { font-weight: 700; color: #1B3A5C; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .photo-cats { display: flex; flex-wrap: wrap; gap: 0.25rem; }
        .photo-cat { display: inline-block; background: #2E8B8B; color: white; padding: 0.15rem 0.6rem; border-radius: 3px; font-size: 0.7rem; font-weight: 600; }
        .photo-desc { font-size: 0.85rem; color: #444; margin-top: 0.35rem; line-height: 1.5; font-style: italic; }
        /* Lightbox */
        #lb { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.92); z-index:999; justify-content:center; align-items:center; cursor:pointer; }
        #lb img { max-width:90vw; max-height:85vh; object-fit:contain; border-radius:4px; }
        #lbcap { position:absolute; bottom:1.5rem; left:50%; transform:translateX(-50%); color:white; font-size:1rem; text-align:center; background:rgba(0,0,0,0.6); padding:0.5rem 1rem; border-radius:4px; max-width: 80vw; }
    </style>

const grid = document.getElementById('grid');
const catCounts = {};
let activeFilter = 'all';

photos.forEach(p => {
    p.cat.forEach(c => { catCounts[c] = (catCounts[c] || 0) + 1; });
    const card = document.createElement('div');
    card.className = 'photo-card';
    card.dataset.cats = p.cat.join(',');
    card.innerHTML = `
        <img src="photos/gallery/thumbs/${p.id}.jpg" alt="${p.label}" loading="lazy"
             onclick="document.getElementById('lb').style.display='flex';document.getElementById('lbimg').src='photos/gallery/full/${p.id}.jpg';document.getElementById('lbcap').textContent='#${p.id} — ${p.label} (${p.cat.join(', ')})'">
        <div class="photo-info">
            <div class="photo-num">#${p.id}
                <div class="photo-cats">${p.cat.map(c => `<span class="photo-cat">${c}</span>`).join('')}</div>
            </div>
            <div class="photo-desc">${p.desc}</div>
        </div>
    `;
    grid.appendChild(card);
});

// Build category filter buttons
const catList = document.getElementById('catList');
const allCats = Object.keys(catCounts).sort();
allCats.forEach(c => {
    const tag = document.createElement('span');
    tag.className = 'cat-tag';
    tag.textContent = c + ' (' + catCounts[c] + ')';
    tag.onclick = () => filterCat(c);
    tag.dataset.cat = c;
    catList.appendChild(tag);
});

function filterCat(cat) {
    activeFilter = cat;
    document.querySelectorAll('.cat-tag').forEach(t => {
        t.classList.toggle('active', cat === 'all' ? t.textContent === 'All' : t.dataset.cat === cat);
    });
    document.querySelectorAll('.photo-card').forEach(card => {
        if (cat === 'all') {
            card.classList.remove('dim');
        } else {
            card.classList.toggle('dim', !card.dataset.cats.split(',').includes(cat));
        }
    });
}

// Stats
const sorted = Object.entries(catCounts).sort((a,b) => b[1]-a[1]);
document.getElementById('stats').innerHTML = '<h3>Category Counts (' + photos.length + ' photos, multi-category enabled)</h3><div class="stat-row">' +
    sorted.map(([c,n]) => `<span class="stat-item">${c}: <span class="stat-count">${n}</span></span>`).join('') + '</div>';
